name: CI

# Бюджет: канон репозиториев, минута на прогон. Потолок job: timeout-minutes.

# Шаблон CI для ПУБЛИЧНОГО репозитория (bootstrap-project). Публичный репозиторий
# всегда идёт на облачном раннере: код из внешних PR не должен исполняться на
# своей машине владельца.
#
# ЗАМЕНИТЬ ПЕРЕД КОММИТОМ: шаги job'а. Всё остальное - канон, и меняется только
# осознанно.

# ТРИГГЕРЫ - КАНОН: push в main плюс pull_request плюс workflow_dispatch.
# Разрешающий `paths:` сюда не добавляют: правка, не попавшая в фильтр, уходит
# в main непроверенной.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ОТМЕНА ТОЛЬКО ДЛЯ PR. На PR пуши до последнего устарели по определению -
# отменять их правильно. На main отмена означает, что коммит, чей прогон убил
# следующий, остаётся в истории непроверенным НАВСЕГДА, а выглядит это как
# обычная отмена. Литеральный `true` здесь - регрессия, не упрощение.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Стек ещё не выбран. Проверки кода появятся здесь с первым кодом.
      - name: Настройка репозитория на месте
        run: test -s .gitignore

  security:
    # Только на PR и ручном запуске: пуш в main несёт код, который уже прошёл скан в PR.
    if: github.event_name != 'push'
    # Находка роняет проверку: красный PR не вливается, а причина видна в журнале
    # этого job'а. Журналы публичного репозитория публичны, поэтому gitleaks
    # запускается с --redact и значение найденного ключа в журнал не попадает.
    #
    # ЛОЖНЫЕ СРАБАТЫВАНИЯ: .gitleaksignore (отпечатки). В .gitleaksignore попадает
    # только ложное срабатывание. Настоящий секрет сначала ротируют, и только потом
    # его отпечаток можно глушить.
    #
    # Образ закреплён по digest: gitleaks v8.30.1. Dependabot образы из `docker run`
    # не видит, поэтому digest обновляют руками при квартальной проверке.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-1' }}
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --verbose --log-opts="$LOG_OPTS" /repo
