name: Build image
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'backlog/**'
      - '.agents/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test
        run: node --test test/*.test.mjs
      - name: Build and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          export DOCKER_CONFIG="$RUNNER_TEMP/hop-registry-$GITHUB_RUN_ID"
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY:sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          docker build --provenance=false --sbom=false --tag "$image" .
          docker push "$image"
